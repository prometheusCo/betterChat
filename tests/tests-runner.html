<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Jasmine Runner - Fixed</title>

    <!-- JASMINE -->
    <link rel="stylesheet" href="https://unpkg.com/jasmine-core/lib/jasmine-core/jasmine.css">
    <script src="https://unpkg.com/jasmine-core/lib/jasmine-core/jasmine.js"></script>
    <script src="https://unpkg.com/jasmine-core/lib/jasmine-core/jasmine-html.js"></script>
    <script src="https://unpkg.com/jasmine-core/lib/jasmine-core/boot0.js"></script>

    <!-- HARD GUARDS BEFORE APP LOAD -->
    <script>

        // Required globals
        window.wait = window.wait || (() => Promise.resolve());
        window.BAR = window.BAR || "BAR";
        window.getLastUserMsgIndex = window.getLastUserMsgIndex || (() => 0);

        // Safe async mocks
        window.apiCall = window.apiCall || (() => Promise.resolve("{}"));
        window.tryApiCall = window.tryApiCall || (() => Promise.resolve("{}"));

        // Storage + side effects
        window.saveStorage = window.saveStorage || (() => { });
        window.loadFromStorage = window.loadFromStorage || (() => Promise.resolve(""));

        // UI / app lifecycle no-ops
        window.loadChatHistory = window.loadChatHistory || (() => { });
        window.renderFAQ = window.renderFAQ || (() => { });
        window.setEvents = window.setEvents || (() => { });
        window.setLearningMode = window.setLearningMode || (() => { });
        window.setLight_Dark_Mode = window.setLight_Dark_Mode || (() => { });
        window.renderHistoryResume = window.renderHistoryResume || (() => { });
        window.showSpinner = window.showSpinner || (() => { });
        window.log = window.log || (() => { });
        window.errorHandling = window.errorHandling || (() => { });

    </script>

    <!-- APP CONFIG -->
    <script src="../CONFIG.js"></script>

    <!-- APP CORE -->
    <script src="../js_components/errors.js"></script>
    <script src="../js_components/outputControl.js"></script>
    <script src="../js_components/storage.js"></script>
    <script src="../js_components/ui.js"></script>
    <script src="../js_components/core.js"></script>

    <!-- DOM + EVENTS -->
    <script defer src="../js_components/dom.js"></script>
    <script defer src="../js_components/events.js"></script>
    <script defer src="../js_components/prompts.js"></script>
    <script defer src="../js_components/flow-control.js"></script>

    <!-- TESTS -->
    <script src="flow-control-tests.js"></script>
</head>

<body>

    <!-- MINIMAL DOM MOCK -->

    <!-- Core -->
    <div style="display: none;" id="workspace-container"></div>
    <div style="display: none;" id="chat-area"></div>
    <div style="display: none;" id="hero"></div>
    <div style="display: none;" id="message-list"></div>

    <!-- Settings -->
    <div style="display: none;" id="settings-modal"></div>
    <div style="display: none;" id="dynamic-settings-wrapper"></div>
    <textarea style="display: none;" id="memory-input"></textarea>

    <!-- FAQ -->
    <div style="display: none;" id="info-modal"></div>
    <div style="display: none;" id="faq-container"></div>

    <!-- History -->
    <div style="display: none;" id="history-modal"></div>
    <div style="display: none;" id="resume-list"></div>

    <!-- Delete -->
    <div style="display: none;" id="delete-modal"></div>

    <!-- Inputs -->
    <textarea style="display: none;" id="user-input"></textarea>

    <!-- Buttons -->
    <button style="display: none;" id="learning-button"></button>
    <button style="display: none;" id="send-button"></button>
    <button style="display: none;" id="stop-button"></button>
    <button style="display: none;" id="theme-toggle"></button>
    <button style="display: none;" id="settings-btn"></button>
    <button style="display: none;" id="info-btn"></button>
    <button style="display: none;" id="close-info"></button>
    <button style="display: none;" id="close-history"></button>
    <button style="display: none;" id="history-button"></button>
    <button style="display: none;" id="delete-storage-btn"></button>
    <button style="display: none;" id="cancel-modal"></button>
    <button style="display: none;" id="save-settings"></button>
    <button style="display: none;" id="cancel-delete"></button>
    <button style="display: none;" id="confirm-delete"></button>


</body>

<script defer src="https://unpkg.com/jasmine-core/lib/jasmine-core/boot1.js"></script>

<style>
    .jasmine_html-reporter {

        padding-bottom: 45px;
        height: 100%;
        z-index: 9999;
        position: absolute;
    }
</style>

</html>
